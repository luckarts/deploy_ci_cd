# CrowdSec profiles — remediation par défaut (schéma officiel)
# Référence : https://raw.githubusercontent.com/crowdsecurity/crowdsec/master/config/profiles.yaml
name: default_ip_remediation
filters:
 - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
 - type: ban
   duration: 4h
on_success: break
---
name: default_range_remediation
filters:
 - Alert.Remediation == true && Alert.GetScope() == "Range"
decisions:
 - type: ban
   duration: 4h
on_success: break
