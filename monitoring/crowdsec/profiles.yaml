# CrowdSec profiles — actions sur détection
name: default_profile
filters:
  # SSH bruteforce → ban 4h
  - alert_id: crowdsecurity/ssh-bf
    decisions:
      - type: ban
        duration: 4h

  # HTTP scan → ban 1h
  - alert_id: crowdsecurity/http-scan-unique_id
    decisions:
      - type: ban
        duration: 1h

  # HTTP crawler → ban 1h
  - alert_id: crowdsecurity/http-crawl-non_statics
    decisions:
      - type: ban
        duration: 1h

  # Traefik bad user-agent → ban 2h
  - alert_id: crowdsecurity/http-bad-user-agent
    decisions:
      - type: ban
        duration: 2h

  # Après 3 bans → ban permanent
  - alert_id: crowdsecurity/multi-bounces
    decisions:
      - type: ban
        duration: 720h