groups:
  - name: container_errors
    interval: 1m
    rules:
      - alert: WatchtowerError
        expr: |
          sum by (container_name) (
            count_over_time(
              {container_name=~"watchtower.*"} |= "error" [5m]
            )
          ) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Watchtower errors detected"
          description: |
            Container {{ $labels.container_name }} has errors in logs.

      - alert: ContainerRestartLoop
        expr: |
          sum by (container_name) (
            count_over_time(
              {container_name=~"watchtower.*"} |= "Restarting" [5m]
            )
          ) > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container_name }} restart loop"

      - alert: DockerAPIVersionMismatch
        expr: |
          sum by (container_name) (
            count_over_time(
              {container_name=~"watchtower.*"} |= "too old" [5m]
            )
          ) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Docker API version mismatch on {{ $labels.container_name }}"
