groups:
  - name: logs
    rules:
      - alert: HighErrorRate
        expr: sum(rate(traefik_service_request_duration_seconds_count{code=~"5.."}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreur HTTP 5xx élevé"
          description: "Plus de 0.5 req/s en 5xx pendant 5 minutes."

      - alert: ContainerRestartLoop
        expr: rate(container_last_seen[10m]) > 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Un conteneur a redémarré plus de 3 fois en 10 minutes"
          description: "Vérifier l'état des conteneurs Docker."

      - alert: TraefikHighLatency
        expr: histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latence Traefik P95 > 5s"
          description: "La latence P95 des requêtes dépasse 5 secondes."

      - alert: NoLogsFromContainer
        expr: count_over_time({container_name=~".+"}[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Aucun log reçu d'un conteneur depuis 5 minutes"
          description: "Vérifier que Promtail collecte bien les logs Docker."